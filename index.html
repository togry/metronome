io. Green while taken","  from the device, blue once you move it; ↺ hands it back.","☀ / 🌙  Toggle between dark and daylight palettes.","","The score and all settings are kept between visits.","♩ METRONOMICON  Click the title — or press and hold it on a","  touchscreen — to reset the score and every setting to defaults."]},{h:"Display",body:["The three dots flash the beat: measure, primary beat, subdivision.","PATTERN shows one dot per click in the current measure, sized by","  weight; hollow dots are rests. When stopped it previews the bar","  the cursor is on, so you can step through with the arrow keys.","The measure readout shows the bar, its meter, and the rehearsal","  mark in force. ↘ or ↗ beside the tempo means a curve is running,","  and the figure is the written tempo, not the one playing."]},{h:"Timeline",body:["Shows the full piece with rehearsal marks, time signatures, and barlines.","Pointer: click → set start · drag → loop region · shift-click → loop end.","Touch: tap → set start · hold then drag → loop region · drag → scroll.","Tap or click while playing to jump immediately.","The playhead glides across each bar, and stays dimmed where it","  stopped until you move the cursor."]},{h:"Loop Region",body:["Define a region to repeat during playback (orange highlight).","Loop end is inclusive — m.6 to m.9 plays m.6, 7, 8, 9 then wraps.","Repeats fully inside a loop are honoured (play twice per cycle).","Repeats spanning a loop boundary are ignored."]},{h:"Keyboard Shortcuts",body:["Space        Play / Stop.","← / →        Move start position one measure at a time.","Shift+→      Start a loop from cursor, or extend loop end.","Shift+←      Shrink loop end (or start a loop ending before cursor).","Ignored while typing in the score editor."]},{h:"Score Format — the basics",body:["Each line says what changes at a measure. Only the measure number","and the separator after it are required.","  1| 4/4 1/4=90    # 4/4 at quarter = 90, from m.1","  5| 3/4           # change of meter, tempo unchanged","  9| 7/8 (2+2+3)   # odd meter, grouped 2+2+3"," 12| 1/4=120       # change of tempo, meter unchanged"," 16||              # end of the piece","Leave out the final || and the score loops from m.1 — the quickest","way to drill a passage.","# or // starts a comment.","","Repeats, D.C./D.S., tempo curves and tuplets have their own","notation: press ? above the score editor for the full description."],exampleKey:"practice"}],scoreHelpTitle:"♩ SCORE FORMAT",scoreHelpSections:[{h:"Score Format",body:["Each line: measure separator [mark] N/D (grouping) 1/note=BPM","All fields except the measure (number) and separator are optional.","Anything that changes stays in force until changed again.","# or // starts a comment — can follow content on the same line.","Bracketed measure number → also becomes rehearsal mark: [12]| 4/4","Text the parser cannot use is shaded in the editor."]},{h:"Time Signatures",body:["Standard: 4/4  3/4  2/2  6/8  9/8  12/8","Compound (6/8, 9/8, 12/8): primary beat = dotted quarter automatically.","Odd meters: add grouping, e.g.  7/8 (2+2+3)  or  5/8 (2+3)","Groupings are remembered per time signature across the score."]},{h:"Tempo",body:["Written as 1/note=BPM.  Examples:","  1/4=120   # quarter note = 120 bpm","  1/4.=60   # dotted quarter = 60 bpm (compound meters)","Tempo carries forward until the next marking."]},{h:"Practice Loop (no end marker)",body:["Omit the final || and the score loops back to m.1 continuously.","The quickest way to drill a short passage — just list the bars","you want and hit play."],exampleKey:"practice"},{h:"Barline Separators",body:["  |  or  :    # Normal barline (default)","  |:          # Open repeat","  :|          # Close repeat (section plays twice)","  |:|         # Single-measure repeat","  ||          # Double barline; last one ends the score","  ||:         # Double barline + open repeat","  :||         # Close repeat + double barline","To start a new repeat immediately after closing one, use","  :| on the last bar of the first repeat, then","  |: on the first bar of the next repeat.","If no || is present the score loops back to m.1 (practice loop)."]},{h:"DC / DS al Fine / al Coda",body:["  DC al Fine    # Jump to m.1; stop at Fine","  DC al Coda    # Jump to m.1; at @ jump to Coda section","  DS al Fine    # Jump to $ (segno); stop at Fine","  DS al Coda    # Jump to $; at @ jump to Coda section","Place $ (segno) and @ (coda jump point) on their measure lines.","The Coda section is skipped on the first pass.","Repeats are not taken on the way back (senza replica)."],exampleKey:"structure"},{h:"Rit / Accel",body:["Simplest form: rit or accel on the bar where the curve starts,","and the tempo it arrives at on a later bar.","  1| 4/4 1/4=120","  3| rit                 # start slowing here","  7| 1/4=60              # arrival; the rit spreads over m.3-6","","Give the target on the same line when it is not simply the tempo","that follows:","  4| rit 1/4=60          # rit this bar, arriving at 60 bpm","  5| a tempo             # snap back to the tempo before the rit","An explicit target is required when 'a tempo' ends the curve,","since there is then no following tempo mark to take it from.","Tempo is interpolated smoothly on every beat, not once per bar."],exampleKey:"rit"},{h:"Tuplets & Rhythmic Patterns",body:["A tuplet spans N beats and divides that span into div equal parts,","which are then combined into notes and rests:","  N[div:slots]","  N     = beats spanned (default 1 if omitted)","  div   = number of equal parts the span is divided into","  slots = how parts are combined: digits and dots sum to div,","          digit = note (duration in parts), . = rest (one part)","","Examples:","  [3:21]        # triplet: long + short (swing feel)","  [3:111]       # three equal triplet notes","  2[3:111]      # quarter-note triplet spanning 2 beats","  [3:.11]       # triplet with silent first part","  [5:11111]     # quintuplet","","Single-element shortcut: a grouping with just one element tiles","to fill the measure if it divides evenly.","  4/4 ([3:21])  # → four swing beats  ([3:21]+[3:21]+[3:21]+[3:21])","  6/8 (2)       # → three groups of two eighth notes  (hemiola feel)","","Alternating subdivisions: list the alternatives and they cycle","from bar to bar.","  5/8 (23,32)   # m.1 = 2+3, m.2 = 3+2, m.3 = 2+3 ...","  Same thing:   (2+3,3+2)   (23),(32)   (2+3),(3+2)","  Any length:   7/8 (223,232,322) repeats every three bars","The cycle counts from the bar where it is written and runs on","through the bars after it; writing a grouping again restarts it."],exampleKey:"tuplet"}]},gf={appTitle:"♩ METRONOMICON",appSubtitle:"NOTESTYRT METRONOM",tooltipReset:"Nullstill partitur og innstillinger",confirmReset:"Nullstille partituret og alle innstillinger? Det lagrede partituret blir forkastet.",scoreUntitled:s=>`Partitur ${s}`,tooltipSelectScore:"Velg hvilket partitur du vil arbeide med",tooltipAddScore:"Legg til et partitur",tooltipDeleteScore:"Slett dette partituret",confirmDeleteScore:"Slette dette partituret? Det kan ikke gjenopprettes.",btnScore:"NOTE",btnThemeDark:"☀",btnThemeLight:"🌙",btnThemeTitleToDaylight:"Bytt til lyst tema",btnThemeTitleToNight:"Bytt til mørkt tema",btnScoreHelpTitle:"Hjelp til partiturformatet",btnHelp:"?",flashLabelMeas:"TAKT",flashLabelBeat:"SLAG",flashLabelUnit:"DELSLAG",btnPlay:"▶",btnStop:"◼",labelNow:"NÅ",labelMeasure:"T.",labelMeasureShort:"t.",labelCountIn:"OPPSLAG",labelOnRepeat:"VED REPETISJON",countInDenom4:"4-deler",countInDenom8:"8-deler",labelSubdivide:"UNDERDELING",subdivOptions:["Per takt","Bare pulsslag","4-deler","8-deler","16-deler","32-deler"],labelTempo:"TEMPO",tooltipTempoReset:"Tilbake til angitt tempo (100 %)",tooltipTempoCurve:"Tempoet endrer seg — tallet er angitt tempo, ikke det som spilles",errClipboard:"Kunne ikke lese utklippstavlen — lim inn manuelt og trykk PARSE",labelBpm:"slag/min",labelBt:"BT",labelBtAuto:"auto",tooltipBtAuto:"Bruk forsin 36||                  # slutt på stykke`,errMeasureOrder:(s,m,f)=>`linje ${s}: t.${m} kommer etter t.${f} — taktnumrene må øke nedover i partituret`,errTooManyMeasures:(s,m)=>`t.${s}: taktnummeret overstiger grensen på ${m} — se etter en skrivefeil`,warnGroupingInvalid:s=>`t.${s}: ugyldig gruppering — sifrene i en tuplett må summere til div; gruppering ignorert`,warnGroupingNotDivisible:(s,m,f,h)=>`t.${s}: grupperingselement (${m} enhet${m!==1?"er":""}) går ikke opp i ${f}/${h} — gruppering ignorert`,warnRitNeedsTarget:s=>`t.${s}: 'rit'/'accel' krever et sluttempo, f.eks. rit 1/4=60`,warnRitNoTarget:s=>`t.${s}: 'rit'/'accel' mangler sluttempo og etterfølgende tempomarkering`,warnRitNoFollowing:s=>`t.${s}: 'rit'/'accel' har ingen etterfølgende tempomarkering eller 'a tempo'`,warnCloseRepeatNoOpen:s=>`t.${s}: slutt repetisjon ':|' mangler tilhørende start repetisjon`,warnDoubleBarNoOpen:s=>`t.${s}: ':||' mangler tilhørende start repetisjon — bruk '||' for å avslutte stykket`,warnNestedRepeat:(s,m)=>`t.${s}: starter en repetisjon mens den fra t.${m} fortsatt er åpen — nøstede repetisjoner er ikke vanlig notasjon; bruk D.C./D.S. for repetisjon i større skala`,helpTitle:"♩ METRONOMICON — HJELP",helpClose:"✕",helpCloseHint:"Klikk utenfor dette panelet eller trykk ✕ for å lukke.",helpCredits:["Konsept og design: Tom Grydeland <tom.grydeland@gmail.com>","Implementasjon: Claude (Anthropic) — Sonnet 4.5 & 4.6, deretter Opus 5,","  dirigert av ovennevnte"],helpBtnPlay:"▶",helpBtnPlayTitle:"Last inn og spill",helpBtnCopy:"⧉",helpBtnCopyTitle:"Kopier til utklippstavle",helpSections:[{h:"Avspilling",body:["▶ / ◼  Spill og stopp.","OPPSLAG  Legger til opptelling før avspilling; velg antall og noteverdi.","  VED REPETISJON: også opptelling hver gang en sløyfe gjentas.","UNDERDELING  Én gang per takt, bare pulsslag, eller underdelt til","  4-deler / 8-deler / 16-deler / 32-deler.","  Underslag legges bare til der slaget deles jævnt.","TEMPO  10–150 % av angitt tempo.","  Trykk på prosenten for å gå tilbake til 100 %.","BT  Forsinker blinkene slik at de passer med Bluetooth-lyden. Grønn","  når verdien kommer fra enheten, blå når du setter den selv; ↺ gir","  den tilbake til enheten.","☀ / 🌙  Veksle mellom mørkt og lyst tema.","","Partituret og alle innstillinger huskes til neste gang.","♩ METRONOMICON  Klikk på tittelen — eller hold den inne på","  berøringsskjerm — for å nullstille partitur og innstillinger."]},{h:"Visning",body:["De tre prikkene blinker slaget: takt, pulsslag, underdeling.","RYTME viser én prikk per klikk i takten, størrelse etter vekt;","  åpne prikker er pauser. Ved stopp vises takten markøren står på,","  så du kan bla gjennom stykket med piltastene.","Taktvisningen viser takt, taktart og gjeldende prøvemerke. ↘ eller","  ↗ ved tempoet betyr at en tempokurve går, og at tallet er angitt","  tempo, ikke det som spilles."]},{h:"Tidslinje",body:["Viser hele stykket med merker, taktarter og taktlinjer.","Peker: klikk → sett start · dra → sløyfe · shift-klikk → sløyfeslutt.","Berøring: trykk → sett start · hold og dra → sløyfe · dra → forskyv.","Trykk eller klikk under avspilling for å hoppe umiddelbart.","Markøren glir gjennom hver takt, og blir stående dempet der den","  stoppet til du flytter startpunktet."]},{h:"Sløyfe",body:["Merk et område som skal gjentas under avspilling (oransje).","Sluttakten er med — t.6 til t.9 spiller t.6, 7, 8, 9 og begynner på nytt.","Repetisjoner helt inne i sløyfen tas med (spilles to ganger per runde).","Repetisjoner som krysser sløyfegrensen ignoreres."]},{h:"Hurtigtaster",body:["Mellomrom    Spill / stopp.","← / →        Flytt startpunktet én takt.","Shift+→      Start en sløyfe fra markøren, eller utvid slutten.","Shift+←      Kort inn sløyfen (eller start en som slutter før markøren).","Ignoreres mens du skriver i partituret."]},{h:"Partiturformat — det grunnleggende",body:["Hver linje sier hva som endres i en takt. Bare taktnummeret og","skilletegnet etter det må være med.","  1| 4/4 1/4=90    # 4/4 med firedel = 90, fra t.1","  5| 3/4           # ny taktart, samme tempo","  9| 7/8 (2+2+3)   # odde taktart, gruppert 2+2+3"," 12| 1/4=120       # nytt tempo, samme taktart"," 16||              # slutt på stykket","Sløyf det siste || og stykket gjentas fra t.1 — den raskeste måten","å terpe et avsnitt på.","# eller // starter en kommentar.","","Repetisjoner, D.C./D.S., tempokurver og tupletter har egen","notasjon: trykk ? over partituret for hele beskrivelsen."],exampleKey:"practice"}],scoreHelpTitle:"♩ PARTITURFORMAT",scoreHelpSections:[{h:"Partiturformat",body:["Hver linje: taktnummer taktskilletegn [merke] N/D (gruppering) 1/note=BPM","Alle felt unntatt taktnummer og skilletegn er valgfrie.","Det som endres gjelder videre til det endres igjen.","# eller // starter en kommentar — kan etterfølge innhold på samme linje.","Taktnummer i hakeparenteser → lager et merke: [12]| 4/4","Tekst som ikke kan tolkes, skyggelegges i partituret."]},{h:"Taktarter",body:["Standard: 4/4  3/4  2/2  6/8  9/8  12/8","Sammensatte takter (6/8, 9/8, 12/8): pulsslag = punktert firedel automatisk.","Odde taktarter: legg til gruppering, f.eks.  7/8 (2+2+3)  eller  5/8 (2+3)","Grupperinger huskes per taktart gjennom hele stykket."]},{h:"Tempo",body:["Skrives som 1/note=BPM.  Eksempler:","  1/4=120   # firedel = 120 slag/min","  1/4.=60   # punktert firedel = 60 slag/min","Tempo gjelder videre til neste tempomarkering."]},{h:"Øvingssløyfe (uten sluttmarkering)",body:["Utelat det siste || og stykket blir gjentatt fra t.1 kontinuerlig.","Raskeste måte å terpe på et kort avsnitt — list bare de taktene","du vil ha og trykk spill."],exampleKey:"practice"},{h:"Taktskilletegn",body:["  |  eller  :  # Vanlig taktstrek (standard)","  |:           # Start repetisjon"," :|            # Slutt repetisjon (spilles to ganger)","  |:|          # Repetisjon av en enkelt takt","  ||           # Dobbel taktstrek; siste avslutter stykket","  ||:          # Dobbel taktstrek + start repetisjon"," :||           # Slutt repetisjon + dobbel taktstrek","For å starte en ny repetisjon rett etter en lukket, bruk","  :| på siste takt i første repetisjon, deretter","  |: på første takt i neste repetisjon.","Uten || gjentar stykket fra t.1 (øvingssløyfe)."]},{h:"DC / DS al Fine / al Coda",body:["  DC al Fine    # Om igjen fra start; stopp ved Fine","  DC al Coda    # Om igjen fra start; ved @ hopp til Coda","  DS al Fine    # Om igjen fra $ (segno); stopp ved Fine","  DS al Coda    # Om igjen fra $; ved @ hopp til Coda","Sett $ (segno) og @ (coda-hoppunkt) på sine taktlinjer.","Coda-delen hoppes over første gang.","Repetisjoner tas ikke på veien tilbake (senza replica)."],exampleKey:"structure"},{h:"Rit / Accel",body:["Enkleste form: rit eller accel i takten der kurven begynner, og","tempoet den ender på i en senere takt.","  1| 4/4 1/4=120","  3| rit                 # begynn å sakne her","  7| 1/4=60              # ankomst; ritardandoet dekker t.3-6","","Angi sluttempoet på samme linje når det ikke er tempoet som følger:","  4| rit 1/4=60          # rit fra denne takten, ned til 60","  5| a tempo             # tilbake til tempoet før ritardandoet","Sluttempo må angis når 'a tempo' avslutter kurven, siden det da","ikke finnes noen etterfølgende tempomarkering å hente det fra.","Tempoet endres jevnt for hvert slag, ikke én gang per takt."],exampleKey:"rit"},{h:"Tupletter og rytmemønstre",body:["En tuplettgruppe strekker seg over N pulsslag og deler spennet","i div like deler, som kombineres til noter og pauser:","  N[div:slots]","  N      = pulsslag som tupletten strekker seg over (standard: 1)","  div    = antall like deler spennet deles i","  slots  = hvordan delene kombineres: siffer og punktum summerer til div,","           siffer = note (varighet i deler), . = pause (én del)","","Eksempler:","  [3:21]        # triol: lang + kort (swingfølelse)","  [3:111]       # åttendedelstriol over 1 slag","  2[3:111]      # firedelstriol over 2 slag","  [3:.11]       # triol med pa
