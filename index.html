ikk under avspilling for å hoppe til takt."]},{h:"Sløyfe",body:["Definer et avsnitt avspilles gjentatte ganger (oransje markering).","Endepunkter er inklusive — t.6 til t.9 spiller t.6, 7, 8, 9 og gjentar.","Repetisjoner helt innenfor en sløyfe respekteres (spilles to ganger per runde).","Repetisjoner som krysser sløyfens grenser ignoreres."]},{h:"Tastatursnarveier",body:["Mellomrom    Spill / Stopp.","← / →        Flytt startposisjon én takt av gangen.","Shift+→      Start sløyfe fra markør, eller utvid sløyfe.","Shift+←      Minsk sløyfe (eller start sløyfe som slutter før markør).","Ignoreres mens du skriver i notefeltet."]}]},Dn={en:{label:"EN",flag:"🇬🇧",strings:dd},no:{label:"NO",flag:"🇳🇴",strings:pd}},hc="metronomicon_locale";function md(){const s=typeof localStorage<"u"&&localStorage.getItem(hc);if(s&&Dn[s])return s;const g=(navigator.language||"en").split("-")[0].toLowerCase();return Dn[g]?g:"en"}let Yo=md();const Fs=new Set;function hd(){return Yo}function gd(s){!Dn[s]||s===Yo||(Yo=s,typeof localStorage<"u"&&localStorage.setItem(hc,s),Fs.forEach(g=>g(s)))}function yd(s){return Fs.add(s),()=>Fs.delete(s)}const vd=new Proxy({},{get(s,g){return Dn[Yo]?.strings[g]??Dn.en.strings[g]}});function kd(){const[s,g]=L.useState(hd);return L.useEffect(()=>yd(p=>g(p)),[]),[vd,s,gd]}const As="metronomicon_score",gc="metronomicon_settings";function Go(){try{return typeof localStorage<"u"?localStorage:null}catch{return null}}function xd(){try{const s=Go()?.getItem(As);return s&&s.trim()?s:null}catch{return null}}function Sd(s){const g=Go();if(!g)return!1;try{return s&&s.trim()?g.setItem(As,s):g.removeItem(As),!0}catch{return!1}}function wd(){try{const s=Go()?.getItem(gc);if(!s)return{};const g=JSON.parse(s);return g&&typeof g=="object"&&!Array.isArray(g)?g:{}}catch{return{}}}function Ed(s){const g=Go();if(!g)return!1;try{return g.setItem(gc,JSON.stringify(s)),!0}catch{return!1}}function Cd({C:s,mobile:g,scoreText:p,setScoreText:d,parseError:S,parseWarnings:C,onParse:z,onCle
