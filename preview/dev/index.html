es rehearsal mark: [12]| 4/4"]},{h:"Practice Loop (no end marker)",body:["Omit the final || and the score loops back to m.1 continuously.","The quickest way to drill a short passage — just list the bars","you want and hit play."],exampleKey:"practice"},{h:"Barline Separators",body:["  |  or  :    Normal barline (default)","  |:          Open repeat","  :|          Close repeat (section plays twice)","  |:|         Single-measure repeat","  ||          Double barline; last one ends the score","  ||:         Double barline + open repeat","  :||         Close repeat + double barline","To start a new repeat immediately after closing one, use","  :| on the last bar of the first repeat, then","  |: on the first bar of the next repeat.","If no || is present the score loops back to m.1 (practice loop)."]},{h:"DC / DS al Fine / al Coda",body:["DC al Fine    Jump to m.1; stop at Fine","DC al Coda    Jump to m.1; at @ jump to Coda section","DS al Fine    Jump to $ (segno); stop at Fine","DS al Coda    Jump to $; at @ jump to Coda section","Place $ (segno) and @ (coda jump point) on their measure lines.","The Coda section is skipped on the first pass."],exampleKey:"structure"},{h:"Rit / Accel",body:["Add 'rit' or 'accel' with a target tempo to begin a smooth","tempo curve. Spans to the next tempo mark or 'a tempo'.","  4| rit 1/4=60          rit this bar, arrive at 60 BPM","  5| a tempo             snap back to previous tempo","  8| 1/4=100 rit 1/4=60  new base tempo, then rit"," 12| 1/4=60              arrival; rit spreads m.8-11","Tempo is interpolated smoothly on every beat."],exampleKey:"rit"},{h:"Tuplets & Rhythmic Patterns",body:["A tuplet spans N beats and divides that span into div equal parts,","which are then combined into notes and rests:","  N[div:slots]","  N     = beats spanned (default 1 if omitted)","  div   = number of equal parts the span is divided into","  slots = how parts are combined: digits and dots sum to div,","          digit = note (duration in parts
